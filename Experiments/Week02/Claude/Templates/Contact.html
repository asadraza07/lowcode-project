<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; font: inherit; }
    .error { color: #b00020; margin: 0.25rem 0 0; font-size: 0.9rem; }
    .invalid { border: 2px solid #b00020; }
    button { margin-top: 1.25rem; padding: 0.5rem 1.25rem; font: inherit; }
  </style>
</head>
<body>
  <h1>Contact us</h1>

  {% if errors %}
    <p class="error" role="alert">Please fix the errors below and try again.</p>
  {% endif %}

  <form method="post" action="{{ url_for('contact') }}" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ values.name }}"
           class="{{ 'invalid' if errors.name }}"
           {% if errors.name %}aria-invalid="true" aria-describedby="name-error"{% endif %}>
    {% if errors.name %}
      <p class="error" id="name-error">{{ errors.name }}</p>
    {% endif %}

    <label for="email">Email</label>
    <input type="text" id="email" name="email" value="{{ values.email }}"
           class="{{ 'invalid' if errors.email }}"
           {% if errors.email %}aria-invalid="true" aria-describedby="email-error"{% endif %}>
    {% if errors.email %}
      <p class="error" id="email-error">{{ errors.email }}</p>
    {% endif %}

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6"
              class="{{ 'invalid' if errors.message }}"
              {% if errors.message %}aria-invalid="true" aria-describedby="message-error"{% endif %}>{{ values.message }}</textarea>
    {% if errors.message %}
      <p class="error" id="message-error">{{ errors.message }}</p>
    {% endif %}

    <button type="submit">Send</button>
  </form>
</body>
</html>
